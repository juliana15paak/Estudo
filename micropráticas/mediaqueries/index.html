<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planos Responsivos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
      <section class="planos-container">
        <h2>Nossos Planos</h2>

        <article class="card">
          <h3>Básico</h3>
          <p>R$ 29,90</p>
          <button aria-label="Assinar plano básico">Assinar</button>
        </article>
        <article class="card">
          <h3>Pro</h3>
          <p>R$ 59,90</p>
          <button aria-label="Assinar plano pro">Assinar</button>
        </article>
        <article class="card">
          <h3>Enterprise</h3>
          <p>Consulte</p>
          <button aria-label="Assinar plano Enterprise">Assinar</button>
        </article>

      </section>
    </main>
</body>
</html>
