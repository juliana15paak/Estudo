<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bento Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="bento-grid">
    <article class="card-perfil">
      <img src="https://github.com/juliana15paak.png" alt="Foto de perfil de Juuh" width="200" height="200">
      <h1>Juuh Dev</h1>
      <p>Front-end Developer</p>
    </article>
    <article class="card-bio">
      <h2>Sobre</h2>
      <p>Apaixonada por interfaces, acessibilidade e CSS.</p>
    </article>
    <article class="card-stats">
      <span>20+</span>
      <p>Projetos</p>
    </article>
    <nav class="card-social" aria-label="Redes Sociais">
      <a href="#" aria-label="Linkedin">LI</a>
      <a href="#" aria-label="GitHub">GH</a>
    </nav>
  </section>
</body>
</html>
