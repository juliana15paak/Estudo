<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="dashboard.css">
  <title>Dashboard</title>
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <img src="https://i.pinimg.com/736x/ae/2a/78/ae2a787068f4a20ffcfc333fcb5e884f.jpg" class="sidebar__logo" alt="Logo DevSpark">
      <nav class="sidebar__nav">
        <ul class="sidebar__list">
          <li><a href="#" class="sidebar__link">Home</a></li>
          <li><a href="#" class="sidebar__link">Perfil</a></li>
        </ul>
      </nav>
    </aside>
    <header class="header">
      <h1 class="header__title">Visão Geral</h1>
      <img src="#" class="user-profile" alt="Foto de perfil do usuário">
    </header>
    <main>
      <section class="stats-grid">
        <article class="stat-card">
          <img src="#" class="stat-card__icon" alt="Ícone do card">
          <h3 class="stat-card__number" aria-describedby="stat-card__label">54</h3>
          <p class="stat-card__label">Label</p>
        </article>
      </section>
      <section class="data-table">
        <table>
          
        </table>
      </section>
    </main>
  </div>
</body>
</html>
